<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="styles.css" />
    <title>Zip Compressor</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="app">
      <section id="drop-zone" class="drop-zone" aria-label="Inputs">
        <div id="empty-hint" class="empty-hint">
          <p class="hint-title">Drop files or folders here</p>
          <p class="hint-sub">or choose them below</p>
        </div>
        <ul id="input-list" class="input-list" hidden></ul>
      </section>

      <div class="row">
        <button id="add-files" type="button">Add Files…</button>
        <button id="add-folder" type="button">Add Folder…</button>
        <span class="spacer"></span>
        <button id="clear-inputs" type="button" class="link" disabled>Clear</button>
      </div>

      <fieldset class="options">
        <div class="preset">
          <label class="field">
            <span>Compression</span>
            <select id="preset" aria-describedby="preset-hint">
              <option value="fast">Fast</option>
              <option value="balanced" selected>Balanced</option>
              <option value="best">Best</option>
              <option value="max">Max (much slower)</option>
              <option disabled>──────────</option>
              <option value="store">Store (no compression)</option>
            </select>
          </label>
          <p id="preset-hint" class="preset-hint"></p>
        </div>
        <label class="check">
          <input id="exclude-junk" type="checkbox" checked />
          <span>Exclude system junk (.DS_Store, __MACOSX, Thumbs.db…)</span>
        </label>
      </fieldset>

      <div class="row actions">
        <button id="compress" type="button" class="primary" disabled>Compress…</button>
        <button id="cancel" type="button" hidden>Cancel</button>
      </div>

      <section id="progress" class="progress" hidden>
        <progress id="progress-bar" max="1" value="0"></progress>
        <div class="progress-meta">
          <span id="progress-text"></span>
          <span id="progress-counts"></span>
        </div>
        <div id="progress-time" class="progress-time" hidden></div>
        <div id="progress-current" class="current"></div>
      </section>

      <section id="result" class="result" hidden>
        <p id="result-title" class="result-title"></p>
        <p id="result-detail" class="result-detail"></p>
        <button id="reveal" type="button" hidden>Show in Finder</button>
      </section>
    </main>
  </body>
</html>
