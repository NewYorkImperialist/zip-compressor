[package]
name = "zip-compressor"
version = "0.1.0"
description = "A fast, high-ratio ZIP compressor"
authors = ["Jayden Lin"]
edition = "2021"

[workspace]
members = ["crates/zipcore", "crates/zipc"]

[workspace.dependencies]
zipcore = { path = "crates/zipcore" }
zip = { version = "9", default-features = false, features = ["deflate", "zstd", "xz", "aes-crypto", "time"] }
walkdir = "2"
thiserror = "2"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zip_compressor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zipcore.workspace = true
