[package]
name = "zip-compressor"
version = "0.1.0"
description = "A fast, high-ratio ZIP compressor"
authors = ["Jayden Lin"]
edition = "2021"

[workspace]
members = ["crates/zipcore", "crates/zipc"]

[workspace.dependencies]
zipcore = { path = "crates/zipcore" }
walkdir = "2"
thiserror = "2"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zip_compressor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zipcore.workspace = true

# One codegen unit for the hot compression crates only: ~2-3% less CPU per
# deflate pass and a smaller zipc, without slowing release builds of the
# Tauri dependency tree. (`lto` cannot be set per package; see [profile.dist].)
[profile.release.package.zipcore]
codegen-units = 1
[profile.release.package.zlib-rs]
codegen-units = 1
[profile.release.package.zopfli]
codegen-units = 1
[profile.release.package.zipc]
codegen-units = 1

# Smallest zipc for distribution (same speed as release, ~25% smaller, ~1.5x
# the clean build time): `cargo build --profile dist -p zipc`.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
