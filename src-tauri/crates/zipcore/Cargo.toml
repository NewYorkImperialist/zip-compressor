[package]
name = "zipcore"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Compression engine for zip-compressor"
license = "MIT"

[dependencies]
# Deflate (zlib-rs + zopfli), plus zstd/xz/AES for the later "Ultra" and encryption presets.
zip.workspace = true
walkdir.workspace = true
thiserror.workspace = true
# Used only to probe whether a large file is worth deflating (same zlib-rs backend zip uses).
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

[target.'cfg(unix)'.dependencies]
# localtime_r for converting mtimes to local DOS time.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
proptest = "1"
