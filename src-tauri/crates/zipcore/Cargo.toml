[package]
name = "zipcore"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Compression engine for zip-compressor"
license = "MIT"

[dependencies]
walkdir.workspace = true
thiserror.workspace = true
# Raw deflate and inflate (src/zlib.rs). Used directly rather than through
# flate2 for the encoder settings flate2 does not expose (the strategy); the
# same version flate2's zlib-rs backend uses, so the bytes are the same.
zlib-rs = { version = "0.5.5", default-features = false, features = ["std"] }
# Zopfli deflate (Method::Zopfli, src/zopfli_codec.rs). Raw deflate only.
zopfli = { version = "0.8.4", default-features = false, features = ["std"] }
# Worker pool with scoped tasks (workers borrow the scanned entries; the scope
# joins every task before `compress` returns).
rayon = "1"
# SIMD CRC-32 with `combine` for per-chunk CRCs (the same crate flate2 uses).
crc32fast = "1.5"
# Gitignore pattern matching for `exclude` / `respect_gitignore` (src/filter.rs):
# ripgrep's matcher, git's semantics. Only its `gitignore` module is used; the
# walk stays walkdir's. Adds ignore, globset and bstr to the lockfile; the rest
# of its tree (regex-automata, memchr, walkdir, ...) is already there.
ignore = "0.4.32"

[target.'cfg(unix)'.dependencies]
# localtime_r for converting mtimes to local DOS time.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Local time of a file's mtime for the DOS date/time fields, using the time-zone
# rules in force on that date (GetDynamicTimeZoneInformation +
# SystemTimeToTzSpecificLocalTimeEx). Same version already in the lockfile.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Time"] }

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
proptest = "1"
# Independent deflate sizing for constructing threshold test inputs.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# Independent reader/oracle for the archives we write (ZipArchive and
# read_zipfile_from_stream). The tests only read Stored and Deflated entries,
# so only the pure-Rust inflate backend is enabled (no zstd-sys, AES, xz).
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
